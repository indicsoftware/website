<script type="text/x-dc" data-dc-script>
const ROUTES = {
  'indic software landing.dc.html': 'landing',
  'projects.dc.html': 'projects',
  'about.dc.html': 'about'
};

class Component extends DCLogic {
  state = { route: 'landing' };

  componentDidMount() {
    this._syncFromHash();
    this._onHash = () => this._syncFromHash();
    window.addEventListener('hashchange', this._onHash);
    this._onClick = (e) => {
      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a) return;
      const raw = a.getAttribute('href') || '';
      if (/^(https?:|mailto:|tel:)/i.test(raw)) return;
      const [file, frag] = decodeURIComponent(raw).split('#');
      const route = ROUTES[(file || '').toLowerCase()];
      if (!route) return;
      e.preventDefault();
      this._go(route, frag);
    };
    document.addEventListener('click', this._onClick, true);
  }

  componentWillUnmount() {
    window.removeEventListener('hashchange', this._onHash);
    document.removeEventListener('click', this._onClick, true);
  }

  _syncFromHash() {
    const h = (window.location.hash || '').replace(/^#\/?/, '');
    const [seg, frag] = h.split('#');
    const route = ['projects', 'about'].indexOf(seg) >= 0 ? seg : 'landing';
    this.setState({ route }, () => this._scrollTo(frag || (route === 'landing' ? seg : '')));
  }

  _go(route, frag) {
    const hash = '#/' + route + (frag ? '#' + frag : '');
    if (window.location.hash !== hash) {
      window.history.pushState(null, '', hash);
    }
    this.setState({ route }, () => this._scrollTo(frag));
  }

  _scrollTo(frag) {
    requestAnimationFrame(() => {
      if (!frag) { window.scrollTo(0, 0); return; }
      const el = document.getElementById(frag);
      if (el) {
        window.scrollTo(0, el.getBoundingClientRect().top + window.pageYOffset - 80);
      } else {
        window.scrollTo(0, 0);
      }
    });
  }

  renderVals() {
    const show = (name) => (this.state.route === name ? {} : { display: 'none' });
    return {
      landingStyle: show('landing'),
      projectsStyle: show('projects'),
      aboutStyle: show('about')
    };
  }
}

</script>
