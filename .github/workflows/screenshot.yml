name: Screenshot a project site

on:
  workflow_dispatch:
    inputs:
      url:
        description: Page to screenshot, for example https://beckn.io/
        required: true
      name:
        description: Short name for the file, written to uploads/t-<name>.png
        required: true

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - name: Take the screenshot at 720 by 391
        env:
          URL: ${{ inputs.url }}
          NAME: ${{ inputs.name }}
        run: |
          cat > shot.mjs <<'JS'
          import { chromium } from "playwright";
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1440, height: 782 }, deviceScaleFactor: 0.5 });
          await page.goto(process.env.URL, { waitUntil: "networkidle", timeout: 90000 });
          await page.waitForTimeout(3000);
          await page.screenshot({ path: `uploads/t-${process.env.NAME}.png` });
          await browser.close();
          JS
          node shot.mjs
          rm shot.mjs
      - name: Commit the screenshot
        env:
          NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "uploads/t-$NAME.png"
          git commit -m "Add screenshot for $NAME"
          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep 5
          done
